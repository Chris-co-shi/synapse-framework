name: Audit Artifact Diagnostic

on:
  pull_request:

jobs:
  audit-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run audit verify
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          mvn -B -pl synapse-audit -am clean verify > audit-diagnostic.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-diagnostic-log
          path: audit-diagnostic.log
      - name: Fail when verify failed
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
