name: Audit Batch Diagnostic

on:
  pull_request:

jobs:
  audit-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Audit verify tail
        shell: bash
        run: |
          set -o pipefail
          mvn -pl synapse-audit -am clean verify 2>&1 | tail -n 200
