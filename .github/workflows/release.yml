name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Validate release version
        shell: bash
        run: |
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo "Version must follow SemVer"; exit 1; }
          test "${version#*-SNAPSHOT}" = "${version}" || { echo "SNAPSHOT cannot be released"; exit 1; }
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag must equal v${version}"; exit 1; }
      - name: Verify and publish
        run: mvn -B clean deploy -DskipTests=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
